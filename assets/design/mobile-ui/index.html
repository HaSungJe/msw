function setRatio(r){state.ratio=Number(r);document.getElementById('ratio').value=String(r);history.replaceState(null,'','?device='+state.device+'&theme='+state.theme+'&ratio='+state.ratio+'#'+state.screen);fit()}
function setDevice(d){state.device=d;state.ratio=d==='pc'?16:20;document.getElementById('ratio').value=String(state.ratio);document.getElementById('mobile').classList.toggle('on',d==='mobile');document.getElementById('pc').classList.toggle('on',d==='pc');go(state.screen)}
function fit(){const height=state.device==='pc'?900:540;const width=height*state.ratio/9;const space=document.getElementById('space'),v=document.getElementById('viewport');v.style.width=width+'px';v.style.height=height+'px';const scale=space.clientWidth/width;v.style.transform=`scale(${scale})`;space.style.height=height*scale+'px'}
function step(d){let i=screens.findIndex(s=>s.id===state.screen);go(screens[(i+d+screens.length)%screens.length].id)}
function toast(t){state.toast=t;render();setTimeout(()=>{if(state.toast===t){state.toast='';render()}},2400)}
function tabs(items,active){return `<div class="tabs">${items.map(([id,t])=>btn(t,`go('${id}')`,id===active?'active':'',({augment:'gem',draw:'card',codex:'info',unit:'shield',unitactive:'up',unitpassive:'sun',unitaugment:'gem',unitbuff:'plus',profile:'sun',profileicon:'people',profiletomb:'shield',recruit:'people','recruit-hero':'shield',recruitinfo:'up',recruitpassive:'sun',recruitprism:'gem'})[id]||'')).join('')}</div>`}
function modal(title,body,{tab='',foot='',sub='',back='play'}={}){return `<div class="shade"></div><section class="modal glass"><header class="modal-head">${btn('',`go('${back}')`,'icon-btn ghost back','back')}<h2>${title}</h2>${sub?`<small>${sub}</small>`:''}${btn('',"go('play')",'icon-btn ghost close','close')}</header>${tab}<div class="modal-body">${body}</div>${foot?`<footer class="footer">${foot}</footer>`:''}</section>`}
function dialog(title,text,{yes='확인',action="go('play')",no='취소',back='play',symbol='info',extra=''}={}){return `<div class="dialog-shade"></div><section class="dialog glass"><div class="symbol">${icon(symbol)}</div><h2>${title}</h2>${extra}${text}<div class="actions">${no?btn(no,`go('${back}')`):''}${btn(yes,action,'primary')}</div></section>`}
function base(selected=false){if(state.device==='pc')return pcBase(selected);let actors=[5,6,7,0,4,3];return `<div class="scene"></div><div class="board">${img('themes/action/zakum-altar/track.png')}${actors.map((j,i)=>`<button aria-label="${jobs[j][1]} 선택" class="actor ${selected&&i===0?'chosen':''}" style="left:${33+i*9}%;top:62%" onclick="state.job=${j};go('selected')">${img('characters/'+jobs[j][0]+'/frames/wait/motion01.png')}</button>`).join('')}${[0,1,2,3].map((_,i)=>`<img class="mob" style="left:${24+i*14}%;top:${i%2?28:82}%" src="${A}monster-thumbnails/monster/M001.png" alt="초록달팽이">`).join('')}</div><header class="hud glass">${btn(img('monster-thumbnails/monster/M001.png'),"go('profile')",'profile')}<span>22라운드<small class="submap">엘나스 · 날카로운 절벽</small></span><span class="pill">${state.diff}</span><span class="counter">${icon('clock')}0:18</span><span class="counter"><span class="coin">${icon('coin')}</span>34,250</span><span class="counter">${icon('flag')}42/110</span><div class="tools">${btn('',"go('paused')",'','pause')}${btn('',"go('restart')",'','restart')}</div></header><div class="sys"><span>${icon('people')}</span><span>•••</span></div>${dock(selected)}`}
function dock(selected=false){if(selected)return `<div class="dock glass selected-dock">${btn('',"go('play')",'icon-btn','back')}<div class="identity">${portrait(state.job,'portrait')}<span>${jobs[state.job][1]}<small>Lv.${state.level}</small></span></div><i class="divider"></i>${btn('상세정보',"go('unit')",'','info')}${btn('레벨업 · 350',"state.level++;toast('레벨이 올랐어요')",'primary','up')}${btn('이동',"go('move')",'','move')}${btn('방출',"go('dismiss')",'danger','trash')}</div>`;
return `<div class="dock glass">${btn('영입',"go('recruit')",'','plus')}<i class="divider"></i>${btn('증강 <span class="badge">7</span>',"go('augment')",'','gem')}<i class="divider"></i>${btn('유닛 <span class="badge">6</span>',"go('units')",'','people')}<div class="speed">${btn('1배속',"toast('1배속으로 변경했어요')",'selected')}${btn('2배속',"toast('2배속으로 변경했어요')")}</div>${btn('설정',"go('settings')",'','gear')}</div>`}
const hubtabs=[['augment','보유 증강'],['draw','증강 뽑기'],['codex','증강 도감']];const unittabs=[['unit','정보'],['unitactive','액티브'],['unitpassive','패시브'],['unitaugment','증강'],['unitbuff','버프']];const proftabs=[['profile','테마'],['profileicon','아이콘'],['profiletomb','비석']];
function statGrid(){return `<div class="stats">${[['atk','공격력','248'],['pct','공격력%','45%'],['fin','최종 데미지','35%'],['boss','보스 공격 시 데미지','40%'],['crit','크리티컬 확률','75%'],['critDmg','크리티컬 데미지','65%']].map(([k,t,n])=>`<div class="statbox">${img('ui/stat-'+k+'.png')}<div><small>${t}</small><strong>${n}</strong></div></div>`).join('')}</div>`}
function radar(recruit=false){const labels=recruit?['공격 속도','사거리','증강 효율','보스','사냥']:['공격력','공격력%','최종 데미지','보스 데미지','크리 확률','크리 데미지'];const n=labels.length;const pt=(i,r)=>[150+Math.sin(i*2*Math.PI/n)*r,124-Math.cos(i*2*Math.PI/n)*r];const pts=r=>labels.map((_,i)=>pt(i,r).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 300 250" fill="none" role="img" aria-label="${recruit?'5축 직업 특성':'6축 능력치'} 도형">${[85,64,43,21].map(r=>`<polygon points="${pts(r)}" stroke="currentColor" opacity=".22"/>`).join('')}${labels.map((t,i)=>{const [x,y]=pt(i,85),[tx,ty]=pt(i,109);return `<path d="M150 124L${x} ${y}" stroke="currentColor" opacity=".2"/><text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="12">${t}</text>`}).join('')}<polygon points="${labels.map((_,i)=>pt(i,[.8,.65,.85,.55,.75,.6][i]*85).join(',')).join(' ')}" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity=".23"/></svg>`}

function skill(name,desc,active=true,controls=true,lv=1){return `<article class="skill"><div class="skill-top"><h3>${name}</h3><span class="pill">Lv.${lv} · ${active?'액티브':'패시브'}</span></div><p>${desc}</p>${active&&controls?`<div class="options">${['사용','보스전 잠금','잠금'].map(t=>btn(t,`state.skillLock='${t}';render()`,state.skillLock===t?'selected':'')).join('')}</div>`:''}</article>`}
function recruitScreen(hero=false){let cols=['전사','궁수','마법사','도적','해적'];let html=`<div class="job-grid">${cols.map((title,col)=>{let list=jobs.map((j,i)=>({j,i})).filter(({j,i})=>j[2]===col&&(hero?i===10:i!==10));return `<div class="job-column"><h3>${title}</h3>${list.length?list.map(({j,i})=>`<button class="job-card" onclick="state.job=${i};go('recruitinfo')">${portrait(i)}<span>${j[1]}</span>${i===5?'<span class="pill">보유 중</span>':''}</button>`).join(''):`<button class="job-card upcoming" disabled>${icon('lock')}출시 예정</button>`}</div>`}).join('')}</div>`;return modal('캐릭터 영입',html,{tab:tabs([['recruit','모험가'],['recruit-hero','영웅']],hero?'recruit-hero':'recruit'),foot:'<span class="small">캐릭터를 고른 뒤 전투판의 빈칸에 배치하세요. · 영입 가능 1명</span>'})}
function recruitInfo(id){let tab=id==='recruitpassive'?'패시브':id==='recruitprism'?'프리즘 증강':'액티브';let body=tab==='액티브'?jobSkills('액티브'):tab==='패시브'?jobSkills('패시브'):`<div class="row">${grade('prism','skill',true)}<div><h3>${["인레이지", "홀리 유니티", "거대화", "애로우 레인", "트루 스나이핑", "블리자드 템페스트", "초월", "디바인 퍼니시먼트", "풍마수리검", "듀얼블레이더", "영웅 팬텀"][state.job]}</h3><p class="small muted">${jobs[state.job][1]} 전용 프리즘 증강</p></div></div>`;return modal(jobs[state.job][1],`<div class="split"><div class="identity-panel recruit-identity">${portrait()}<h3>${jobs[state.job][1]}</h3><span class="pill">${state.job===10?'영웅':'모험가'} · ${['전사','궁수','마법사','도적','해적'][jobs[state.job][2]]}</span>${radar(true)}</div><div class="scroll">${body}</div></div>`,{tab:tabs([['recruitinfo','액티브'],['recruitpassive','패시브'],['recruitprism','프리즘 증강']],id==='recruitblocked'?'recruitinfo':id),foot:`<span class="small">${id==='recruitblocked'?'이미 보유 중인 캐릭터예요.':'캐릭터를 선택하면 배치할 수 있는 칸이 표시돼요.'}</span>${btn(id==='recruitblocked'?'보유 중':'선택',id==='recruitblocked'?'':"go('place')",'primary'+(id==='recruitblocked'?' unavailable':''))}`,back:'recruit'})}
function unitScreen(id){const mode=id;if(id==='unitmax'||id==='unitpoor')id='unit';let active=id==='unittarget'?'unitactive':id==='efficiency'?'unit':id;let body='';if(id==='unit')body=`<div class="unit-summary"><div class="identity-panel">${portrait()}<h3>${jobs[state.job][1]}</h3><span class="level">Lv.${mode==='unitmax'?50:state.level}</span>${btn('증강 효율 보기',"go('efficiency')",'small')}</div><div class="stats-wrap">${radar()}<div>${statGrid()}<p class="small muted">공격 속도 1.00 · 방어율 무시 20%</p></div></div></div>`;
else if(id==='efficiency')body=`<div class="split"><div class="identity-panel">${portrait()}<h3>보스 DPS</h3><div class="large-value">12,840</div><small class="muted">방어율 제외 · 예시 값</small></div><div class="scroll"><h3>어떤 증강이 잘 어울릴까요?</h3><p class="small muted">실버 I 하나를 더 적용했을 때의 증가량</p>${[['크리티컬 데미지','18.2%','critDmg'],['공격력%','12.5%','pct'],['크리티컬 확률','8.4%','crit'],['공격력','6.1%','atk']].map(([t,v,k],i)=>`<div class="row"><span class="badge">${i+1}</span>${grade('silver',k)}<div class="body"><b>${t}</b></div><strong>+${v}</strong></div>`).join('')}</div></div>`;
else if(id==='unitactive'||id==='unittarget')body=jobSkills('액티브',true)+`<div class="row"><div class="body"><b>스킬 적용 대상</b><small>지정 가능한 스킬에서만 표시돼요.</small></div>${btn('대상 선택',"go('unittarget')")}</div>`;
else if(id==='unitpassive')body=jobSkills('패시브');
else if(id==='unitaugment')body=`<div class="notice">증강 3개 합계 · 공격력 +40 · 공격력 +12.5% · 크리티컬 데미지 +15%</div>${augRow('공격력 I','silver','atk','적용 중')}${augRow('공격력% I','silver','pct','적용 중')}${augRow('크리티컬 데미지 I','silver','critDmg','적용 중')}`;
else body=`<div class="notice">적용 중인 효과 2개 · 같은 효과는 한 번만 표시해요.</div>${augRow('프레이','prism','skill','비숍의 파티 버프')}${augRow('프리즘 증강 효율','prism','fin','강화 효과 적용 중')}`;
let html=modal('캐릭터 상세정보',body,{tab:tabs(unittabs,active),sub:jobs[state.job][1],back:'selected',foot:`<span class="small">${mode==='unitmax'?'Lv.50 · 최대 레벨에 도달했어요.':mode==='unitpoor'?'메소가 부족해요.':'Lv.'+state.level+' · 다음 레벨에서 더 강해져요.'}</span>${btn(mode==='unitmax'?'최대 레벨 도달':mode==='unitpoor'?'메소 부족 · 350':'레벨업 · 350',mode==='unitmax'||mode==='unitpoor'?'':"state.level++;toast('레벨이 올랐어요')",'primary'+(mode==='unitmax'||mode==='unitpoor'?' unavailable':''),'up')}`});if(id==='unittarget')html+=dialog('스킬 적용 대상','<p>적용할 캐릭터를 선택하세요.</p>'+unitChoices(),{yes:'지정',back:'unitactive',action:"go('unitactive');toast('대상을 지정했어요')",symbol:'people'});return html}
function augRow(name,g,k,status,action="go('assign')"){return `<div class="row row-click" onclick="${action}" role="button" tabindex="0">${grade(g,k)}<div class="body"><b>${name}</b><small>${status}</small></div>${icon('next')}</div>`}
function unitChoices(){return `<div class="choose-units">${[5,6,7,0,4,3].map((j,i)=>`<button class="${state.selectedUnit===i?'selected':''}" onclick="state.selectedUnit=${i};render()">${portrait(j)}<span>${jobs[j][1]}</span><small>Lv.${10+i*2}</small></button>`).join('')}</div>`}
function augmentScreen(id){let body;if(id==='augmentempty')body=`<div class="empty">${icon('gem')}<b>아직 보유한 증강이 없어요</b><p>라운드를 진행하거나 증강을 뽑아 보세요.</p>${btn('증강 뽑기',"go('draw')",'primary')}</div>`;else body=`<div class="split"><div class="scroll"><div class="section-head"><h3>보유 4 · 미선택 3</h3>${btn(state.hideApplied?'전체 보기':'적용 숨기기',"state.hideApplied=!state.hideApplied;render()")}</div>${augRow('실버 I 증강','silver','skill','미선택 · 원하는 종류를 고르세요',"go('picksilver')")}${augRow('골드 II 증강','gold','skill','미선택 · 원하는 종류를 고르세요',"go('pickgold')")}${augRow('프리즘 증강','prism','skill','미선택 · 후보 3개',"go('pickprism')")}${augRow('공격력 I','silver','atk','미지정')}${!state.hideApplied?augRow('크리티컬 데미지 I','silver','critDmg','히어로 · 적용 중'):''}</div><div class="scroll"><div class="row">${grade('silver','atk',true)}<div><span class="pill">실버 I</span><h3 style="margin-top:9px">공격력</h3><p class="muted small">공격력이 증가합니다.</p></div></div><h3>적용할 캐릭터</h3>${unitChoices()}<p class="small muted">지정 후 대상 캐릭터에게 효과가 적용돼요.</p></div></div>`;return modal('증강',body,{tab:tabs(hubtabs,'augment'),foot:`<span class="small">미선택 → 받기 → 캐릭터 지정 · 방출 시 해당 증강은 사라져요.</span>${id==='augmentempty'?'':btn('이 캐릭터에게 지정',"go('augment');toast('증강을 지정했어요')",'primary')}`})}
function drawScreen(disabled=false){return modal('증강',`<div class="wallet"><span>보유 메소</span><strong>${disabled?'250':'34,250'}</strong></div><div class="rates">${[['bronze','브론즈','50%'],['silver','실버','35%'],['gold','골드','10%'],['prism','프리즘','5%']].map(([g,n,v])=>`<div class="card">${grade(g,'skill')}<h3>${n}</h3><strong>${v}</strong></div>`).join('')}</div><div class="notice">등급·단계는 무작위, 종류는 원하는 것을 선택해요.<br>프리즘을 얻지 못하면 다음 뽑기의 프리즘 확률이 올라요.<br>선택 대기 3개 · 선택은 보유 증강에서 할 수 있어요.</div>`,{tab:tabs(hubtabs,'draw'),foot:`<span class="small">${disabled?'메소가 750 더 필요해요.':'뽑기 후에도 이 화면을 유지해요.'}</span><button class="primary" ${disabled?'disabled':`onclick="toast('증강을 뽑았어요 · 보유 증강에서 선택하세요')"`}>${icon('gem')}증강 뽑기 · 1,000</button>`})}
function pickScreen(id){let prism=id==='pickprism'||id==='pickzakum',g=prism?'prism':id==='pickgold'?'gold':id==='pickbronze'?'bronze':'silver';let choices=prism?[['인레이지','히어로의 레이징 블로우 강화','skill'],['트루 스나이핑','신궁의 스나이핑 강화','skill'],['블리자드 템페스트','아크메이지(썬·콜)의 블리자드 강화','skill']]:[['공격력','공격력이 증가합니다.','atk'],['공격력%','공격력이 비율로 증가합니다.','pct'],['크리티컬 확률','크리티컬 확률이 증가합니다.','crit'],['크리티컬 데미지','크리티컬 데미지가 증가합니다.','critDmg']];if(id==='pickgold')choices.push(['최종 데미지','최종 데미지가 증가합니다.','fin']);if(id==='pickzakum')choices.push(['홀리 유니티','팔라딘의 아군 강화','skill'],['거대화','다크나이트의 스피어 버스터 강화','skill'],['애로우 레인','보우마스터의 화살비','skill'],['초월','불·독의 도트 퍼니셔 강화','skill'],['디바인 퍼니시먼트','비숍의 스킬 강화','skill'],['풍마수리검','나이트로드의 거대 수리검','skill'],['자유전직 - 듀얼블레이더','섀도어 자유전직','skill'],['영웅 팬텀','팬텀 영입 해금','skill']);return modal('증강 선택',`<div class="offer-scroll">${choices.map(([n,d,k])=>`<article class="card offer ${id==='pickzakum'?'many':''}"><span class="type">${prism?'프리즘':g==='gold'?'골드 II':g==='bronze'?'브론즈 I':'실버 I'}</span>${prism?prismIcon(n):grade(g,k,true)}<h3>${n}</h3><p>${d}</p>${btn('받기',"go('augment');toast('증강을 받았어요 · 적용할 캐릭터를 골라 주세요')",'primary')}</article>`).join('')}</div>`,{tab:tabs(hubtabs,'augment'),back:'augment',sub:id==='pickzakum'?'자쿰 보상 · 좌우로 넘겨 전체 후보 보기':'하나를 선택하세요',foot:`<span class="small">하나를 받은 뒤, 보유 증강에서 캐릭터에게 지정하세요.</span>${btn('보유 증강으로',"go('augment')",'ghost')}`})}
function tierDetail(k){return state.expanded===k?'<div class="tier-detail">I · 기본 효과<br>II · 효과 증가<br>III · 최대 단계<br><small>단계별 실제 수치는 기존 증강 표에서 연결</small></div>':''}

function profileScreen(id){let body='',active=id==='profileicon'?'profileicon':id==='profiletomb'?'profiletomb':'profile';if(active==='profile'){body=`<div class="subtabs">${btn('기본',"go('profile')",id==='profile'?'selected':'')}${btn('액션',"go('profileaction')",id==='profileaction'?'selected':'')}</div><div class="cards-grid">${id==='profileaction'?`<article class="card">${img('themes/action/zakum-altar/keyframe.png')}<h3>자쿰의 제단</h3><span class="pill">액션 테마 · 사용 중</span><p class="small muted">게임에서는 전투판과 유저 카드가 움직여요. 시안은 정지 이미지예요.</p>${btn('미리보기 · 선택',"state.themeName='자쿰의 제단';go('themeconfirm')")}</article>`:themes.map(([k,n])=>`<article class="card">${img('themes/scenery/'+k+'-thumb-400x240.png')}<h3>${n}</h3>${btn('선택',`state.themeName='${n}';go('themeconfirm')`)}</article>`).join('')}</div>`}

else body=`<div class="cards-grid"><article class="card">${img('tombstone/basic-cartoon-source.png','tomb')}<h3>기본 비석</h3><span class="pill">사용 중</span><p class="small muted">탈락한 구역에 표시됩니다.</p>${btn('선택',"go('tombconfirm')")}</article></div>`;
return modal('프로필 설정',body,{tab:tabs(proftabs,active),sub:'선택한 설정은 다음 게임에도 유지돼요',foot:'<span class="small">내 프로필 설정은 다음 게임에도 유지돼요.</span>'})}

function playersScreen(){return modal('유저 목록',`<div class="cards-grid" style="grid-template-columns:1fr 1fr">${['부르미','단풍여행','마법의숲','별빛'].map((n,i)=>`<div class="player-card ${i===0?'mine':''}" style="background-image:url('${A+ (i===0?'themes/action/zakum-altar/keyframe.png':'themes/scenery/'+themes[i][0]+'-thumb-400x240.png')}')">${img('monster-thumbnails/monster/M00'+(i+1)+'.png')}<div class="body"><b>${n}${i===0?' · 나':''}</b><small>${i===0?'자쿰의 제단 · 액션 테마':'어려움 · 진행 중'}</small></div>${btn(i===0?'내 구역':'관전',`go('${i===0?'play':'spectate'}')`)}</div>`).join('')}</div>`,{foot:'<span class="small">선택한 테마가 카드 배경에 표시돼요. 내 카드는 테두리와 문양으로 구분해요.</span>'})}
function settings(){return modal('설정',`<div class="settings"><div class="row"><div class="body"><b>화면 모드</b><small>다음 게임에도 같은 모드로 시작해요.</small></div><div class="group">${btn('라이트',"setTheme('light')",state.theme==='light'?'selected':'','sun')}${btn('다크',"setTheme('dark')",state.theme==='dark'?'selected':'','moon')}</div></div><div class="row"><div class="body"><b>프로필 설정</b><small>테마 · 아이콘 · 비석</small></div>${btn('열기',"go('profile')",'','next')}</div><div class="row"><div class="body"><b>유저 목록</b><small>플레이어의 프로필과 전투판 확인</small></div>${btn('열기',"go('players')",'','next')}</div><div class="notice">모바일에서는 화면 모드 설정을 이곳에 모아 게임판 공간을 확보해요.</div></div>`,{foot:btn('게임으로 돌아가기',"go('play')",'primary')})}
function enemy(boss=false){return `<section class="enemy-panel glass">${btn('',"go('play')",'close','close')}<div class="enemy-row">${img('monster-thumbnails/'+(boss?'boss/B01':'monster/M001')+'.png')}<div class="body"><span class="pill">${boss?'보스':'일반 몬스터'}</span><h3 style="margin:5px 0">${boss?'자쿰':'초록달팽이'}</h3><div class="health"></div><div class="small muted">${boss?'720,000 / 1,000,000 · 방어율 50%':'720 / 1,000 · 1라운드'}</div></div></div><div class="chips">${btn('블리자드',"go('debuff')")}${btn('포이즌 리전',"go('debuff')")}${boss?btn('방어구 부수기',"go('debuff')"):''}</div></section>`}
function resultScreen(clear=false,multi=false){return dialog(clear?'클리어!':'이번 도전은 여기까지',`<p>${clear?'검은 마법사를 처치했어요.':'필드의 몬스터가 한도에 도달했어요.'}</p><div class="result-grid"><div class="card">도달 라운드<b>${clear?'132':'22'}라운드</b></div><div class="card">처치한 몬스터<b>${clear?'4,250':'712'}마리</b></div><div class="card">선택 난이도<b>${state.diff}</b></div><div class="card">내 최고 기록<b>${clear?'클리어':'43라운드'}</b></div></div>`,{yes:multi?'관전':'다시하기',action:multi?"go('spectate')":"go('restart')",no:multi?'닫기':'닫기',symbol:clear?'shield':'flag'})}

function pcBase(selected=false){return `<div class="scene"></div><div class="pc-title">MAPLE AUGMENT DEFENSE</div><div class="board">${img('themes/action/zakum-altar/track.png')}${[5,6,7,0,4,3].map((j,i)=>`<button aria-label="${jobs[j][1]} 선택" class="actor ${selected&&j===state.job?'chosen':''}" style="left:${33+i*9}%;top:62%" onclick="state.job=${j};go('selected')">${img('characters/'+jobs[j][0]+'/frames/wait/motion01.png')}</button>`).join('')}${[0,1,2,3].map((_,i)=>`<img class="mob" style="left:${24+i*14}%;top:${i%2?28:82}%" src="${A}monster-thumbnails/monster/M001.png" alt="초록달팽이">`).join('')}</div><aside class="pc-left glass"><div class="pc-profile">${img('monster-thumbnails/monster/M001.png')}<div><b>부르미</b><small>자쿰의 제단</small></div></div><div class="pc-round">22라운드<span class="pill">${state.diff}</span></div><p class="pc-map">엘나스 · 날카로운 절벽</p><div class="pc-metrics"><div><small>남은 시간</small><b>0:18</b></div><div><small>필드</small><b>42 / 110</b></div><div style="grid-column:1/-1"><small>보유 메소</small><b class="coin">34,250</b></div></div><div class="action-pair">${btn('일시정지',"go('paused')",'','pause')}${btn('다시하기',"go('restart')",'','restart')}</div>${btn('프로필 설정',"go('profile')",'profile-link','gear')}${btn('유저 목록',"go('players')",'profile-link','people')}</aside><div class="sys"><span>${icon('people')}</span><span>•••</span></div><aside class="pc-roster glass"><div class="section-head"><h3>보유 유닛</h3><span class="badge">6</span></div>${[5,6,7,0,4,3].map((j,i)=>`<div class="row row-click ${selected&&j===state.job?'chosen':''}" role="button" tabindex="0" onclick="state.job=${j};go('selected')">${portrait(j)}<div class="body"><b>${jobs[j][1]}</b><small>Lv.${10+i*2}</small></div></div>`).join('')}</aside><aside class="pc-switches glass"><div class="switch-row">${btn('1배속',"toast('1배속으로 변경했어요')",'selected')}${btn('2배속',"toast('2배속으로 변경했어요')")}</div>${btn('다크모드 <span>'+ (state.theme==='dark'?'켜짐':'꺼짐')+'</span>',"setTheme(state.theme==='dark'?'light':'dark');render()",'dark-switch','moon')}</aside>${dock(selected)}`}
function placementCells(id){const turns=[[15,9],[12,9],[12,13],[14,13],[14,11],[8,11],[8,9],[10,9],[10,13],[2,13],[2,11],[6,11],[6,2],[4,2],[4,4],[16,4],[16,1],[14,1],[14,6],[11,6]],blocked=new Set(['8,6','9,6','8,7','9,7']);for(let i=1;i<turns.length;i++){let [x,y]=turns[i-1],[tx,ty]=turns[i];while(x!==tx||y!==ty){blocked.add(x+','+y);x+=Math.sign(tx-x);y+=Math.sign(ty-y)}blocked.add(tx+','+ty)}return Array.from({length:208},(_,i)=>{let x=i%16+1,y=13-Math.floor(i/16);return blocked.has(x+','+y)?'<span class="invalid"></span>':`<button aria-label="빈칸 ${x}, ${y}" onclick="go('selected');toast('${id==='place'?'캐릭터를 배치했어요':'위치를 이동했어요'}')"></button>`}).join('')}

if(id==='recruit'||id==='recruit-hero')return html+recruitScreen(id==='recruit-hero');if(['recruitinfo','recruitpassive','recruitprism','recruitblocked'].includes(id))return html+recruitInfo(id);if(['unit','unitmax','unitpoor','unitactive','unitpassive','unitaugment','unitbuff','unittarget','efficiency'].includes(id))return html+unitScreen(id);if(['augment','assign','augmentempty'].includes(id))return html+augmentScreen(id);if(id==='draw'||id==='drawdisabled')return html+drawScreen(id==='drawdisabled');if(id.startsWith('pick'))return html+pickScreen(id);if(id==='codex'||id==='codexprism')return html+codexScreen(id==='codexprism');if(['profile','profileaction','profileicon','profiletomb'].includes(id))return html+profileScreen(id);if(id==='iconinfo'||id==='iconlocked')return html+iconInfo(id==='iconlocked');if(id==='players')return html+playersScreen();if(id==='settings')return html+settings();

if(id==='start')return html+modal('난이도를 선택하세요',`<p class="muted">이번 판에 도전할 난이도를 골라 주세요.</p><div class="difficulty-grid">${['매우쉬움','쉬움','보통','어려움','매우어려움','극악'].map(t=>btn(t,`state.diff='${t}';render()`,state.diff===t?'selected':'')).join('')}</div><div class="notice">15초 뒤 시작해요. 선택한 난이도는 게임 중에 변경할 수 없어요.</div>`,{foot:`<span class="small">선택한 난이도 · ${state.diff}</span>${btn('바로 시작',"go('recruit')",'primary','arrow')}`});
if(id==='units')return html+`<aside class="drawer glass"><div class="section-head"><h3>보유 유닛 · 6</h3>${btn('',"go('play')",'icon-btn ghost','close')}</div>${[5,6,7,0,4,3].map((j,i)=>`<div class="row row-click" role="button" tabindex="0" onclick="state.job=${j};go('selected')">${portrait(j)}<div class="body"><b>${jobs[j][1]}</b><small>Lv.${10+i*2}</small></div>${icon('next')}</div>`).join('')}</aside>`;

if(id==='vote')return html+dialog('다시하기 투표','<p>새로운 판을 시작할까요?</p><div class="notice">찬성 1 · 반대 0 · 과반수 2명<br>남은 시간 18초</div>',{yes:'찬성',no:'반대',action:"go('play');toast('찬성했어요')",symbol:'people'});
if(id==='spectate')return html.replace(/<div class="dock glass">[\s\S]*$/, '')+`<div class="hint glass">${icon('eye')} 단풍여행의 구역을 보고 있어요. ${btn('내 구역으로',"go('play')")}</div>`;
if(id==='monster'||id==='boss')return html+enemy(id==='boss');if(id==='debuff')return html+enemy(true)+dialog('블리자드','<p>이동 속도가 감소합니다.</p><p class="small">남은 시간 3.2초</p>',{yes:'확인',no:'',action:"go('boss')",symbol:'info'});
if(id==='restart')return html+dialog('다시 시작할까요?','<p>현재 판을 종료하고 처음부터 시작해요.</p><p class="small">프로필과 화면 모드 설정은 유지돼요.</p>',{yes:'다시하기',action:"go('start')",no:'아니오',symbol:'restart'});
if(id==='dismiss')return html+dialog('캐릭터를 방출할까요?',`<p class="name">${jobs[state.job][1]} · Lv.${state.level}</p><p class="danger-text">지정한 증강은 함께 사라져요.</p><p class="small">레벨업에 사용한 메소의 일부를 돌려받아요.</p>`,{yes:'방출',back:'selected',action:"go('play');toast('캐릭터를 방출했어요')",symbol:'trash'});
if(id==='result'||id==='clear'||id==='resultmulti')return html+resultScreen(id==='clear',id==='resultmulti');
if(id==='toasts')return html+modal('안내 메시지',`<div class="notice">${icon('check')} 증강을 지정했어요.</div><div class="notice">${icon('coin')} 메소가 부족해요.</div><div class="notice">${icon('clock')} 잠시 뒤 다시 시도해 주세요.</div><div class="notice" style="color:var(--danger)">${icon('info')} 설정을 저장하지 못했어요. 이전 설정을 유지해요.</div>`,{sub:'자동으로 사라지는 공통 메시지',foot:'<span class="small">현재 창을 닫거나 내용을 초기화하지 않아요.</span>'});
if(id==='devprism')return html+modal('테스트 프리즘 증강',`<div class="notice">개발 도구 활성화 시에만 표시되는 화면입니다.</div>${augRow('인레이지','prism','skill','적용 켜기 / 끄기',"toast('테스트 프리즘 적용 상태를 변경했어요')")}${augRow('블리자드 템페스트','prism','skill','적용 켜기 / 끄기',"toast('테스트 프리즘 적용 상태를 변경했어요')")}`,{foot:btn('전부 삭제',"toast('테스트 프리즘을 정리했어요')",'danger')});
if(id==='rank')return html+modal('순위',`<div class="notice">기존 코드에만 남아 있는 화면입니다. 현재 게임에서는 진입점이 비활성화되어 있어요.</div><div class="subtabs">${btn('어려움',"toast('어려움 순위')",'selected')}${btn('매우어려움',"toast('매우어려움 순위')")}${btn('극악',"toast('극악 순위')")}</div>${['단풍여행','부르미','마법의숲'].map((n,i)=>`<div class="row"><span class="badge">${i+1}</span><div class="body"><b>${n}</b></div><strong>${12-i*3}회</strong></div>`).join('')}`,{foot:'<span class="small">내 순위 2위 · 클리어 9회 · 예시 데이터</span>'});return html}
const notes={play:'기존의 좌우 큰 패널을 접고, 상단 한 줄 정보와 하단 조작 바에 핵심 기능을 모았습니다. 트랙의 비율과 진행 방식은 유지합니다.',selected:'선택한 캐릭터의 조작은 하단 고정 바에서 합니다. 캐릭터 옆을 가리는 팝업은 사용하지 않습니다.',recruit:'항상 모험가부터 열립니다. 전사·궁수·마법사·도적·해적 5열은 유지하며, 작은 화면에서는 목록 영역을 세로로 스크롤합니다. 영입 카드에는 레벨을 표시하지 않습니다.',augment:'미선택 증강도 보유 목록에 개별 행으로 표시합니다. 뽑기는 구매 전용이며 선택 페이지로 자동 이동하지 않습니다.',unit:'정보를 한 화면에 과하게 넣지 않고 정보·액티브·패시브·증강·버프로 나눴습니다. DPS와 증강 효율도 별도 보기로 열 수 있습니다.',settings:'라이트·다크는 모든 화면의 동일한 배치를 공유합니다. 실제 게임 적용 시에는 기존 서버 uiMode 저장 계약을 그대로 사용합니다. 이 시안은 서버와 연결되지 않습니다.',profile:'프로필 영역은 불투명입니다. 변경 확인창을 위에 겹쳐 표시하며, 아래의 목록과 스크롤은 유지해야 합니다.',pickgold:'골드 5장은 글자를 축소하지 않고 가로로 넘깁니다. 아이콘·제목·받기 버튼은 같은 높이에 고정합니다.',pickzakum:'자쿰 보상은 전체 후보를 가로 스크롤합니다. 일반 프리즘의 무작위 3장과 구분합니다.',rank:'현재 실제 진입점이 없는 기존 코드 화면입니다. 사용자용 기능으로 새로 활성화하자는 제안이 아닙니다.',devprism:'현재 DevTools가 켜질 때만 보이는 개발용 화면입니다. 일반 플레이 메뉴에는 노출하지 않습니다.'};
function renderCatalog(){let q=document.getElementById('search').value.trim();document.getElementById('catalog').innerHTML=groups.map(([g,rows])=>`<section><div class="cat-title">${g}</div>${rows.filter(([id,t])=>!q||(t+g).includes(q)).map(([id,t])=>`<button class="${state.screen===id?'active':''}" onclick="go('${id}')"><b>${String(screens.findIndex(s=>s.id===id)+1).padStart(2,'0')}</b>${t}</button>`).join('')}</section>`).join('')}
function render(){const s=screens.find(x=>x.id===state.screen);document.getElementById('screenTitle').textContent=s.title;document.getElementById('category').textContent=s.group;document.getElementById('progress').textContent=`${screens.indexOf(s)+1} / ${screens.length} 화면 · 모든 화면 라이트 / 다크 지원`;document.getElementById('viewport').classList.toggle('spectating',state.screen==='spectate');document.getElementById('viewport').innerHTML=content()+(state.toast?`<div class="toast glass" role="status">${icon('check')}${state.toast}</div>`:'');document.getElementById('guide').innerHTML=`<b>이 화면의 설계</b><p>${state.device==='pc'&&s.id==='play'?'진행 정보는 왼쪽, 유닛은 오른쪽, 영입·증강은 하단 중앙으로 모았습니다. 일시정지와 다시하기는 같은 크기로 묶고 속도·다크모드는 오른쪽 아래에 둡니다.':notes[s.id]||'기존 기능과 선택 흐름을 유지하면서 모바일에서 읽고 누르기 편하게 재배치했습니다. 실제 효과·수치·보유 상태는 게임 데이터로 연결해야 합니다.'}</p><p class="muted">${state.device==='pc'?'PC: 좌측 진행 정보 · 우측 유닛 · 중앙 전투판 · 중앙 팝업':'모바일: 가로 16:9~21:9 · 좌우 안전 여백 · 하단 홈 바 회피 · 큰 터치 영역'} · 라이트/다크 공통 배치</p>`;renderCatalog();document.getElementById('viewport').classList.toggle('pc',state.device==='pc');document.getElementById('viewport').classList.toggle('dark',state.theme==='dark');document.getElementById('light').classList.toggle('on',state.theme==='light');document.getElementById('dark').classList.toggle('on',state.theme==='dark');fit()}
document.getElementById('search').addEventListener('input',renderCatalog);window.addEventListener('resize',fit);document.addEventListener('keydown',e=>{if(e.key==='Escape')go('play');if(e.target.matches('input,select'))return;if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return;}if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});const initialParams=new URLSearchParams(location.search);state.device=initialParams.get('device')==='pc'?'pc':'mobile';state.theme=initialParams.get('theme')==='dark'?'dark':'light';state.ratio=[16,19.5,20,21].includes(Number(initialParams.get('ratio')))?Number(initialParams.get('ratio')):state.device==='pc'?16:20;document.getElementById('ratio').value=String(state.ratio);document.getElementById('mobile').classList.toggle('on',state.device==='mobile');document.getElementById('pc').classList.toggle('on',state.device==='pc');if(screens.some(s=>s.id===location.hash.slice(1)))state.screen=location.hash.slice(1);render();
</script>
</html>
