<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메이플 증강 디펜스 · 마을 테마 시안</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Malgun Gothic", sans-serif; }
    body { margin: 0; padding: 32px; background: #211f22; color: #fff1d8; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #cdbda8; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
    figure { margin: 0; overflow: hidden; border-radius: 16px; background: #352820; border: 1px solid #755b41; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; object-fit: cover; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 18px; }
    strong { font-size: 19px; }
    span { color: #d4bea2; font-size: 14px; text-align: right; }
  </style>
</head>
<body>
  <h1>마을 테마 방향 시안</h1>
  <p>원작 마을의 랜드마크를 위에서 보는 디펜스 판으로 번역한 콘셉트입니다. 실제 게임 경로 텍스처는 별도로 제작합니다.</p>
  <main>
    <figure><img src="henesys-concept.png" alt="헤네시스 시안"><figcaption><strong>헤네시스</strong><span>버섯집 · 잔디 언덕</span></figcaption></figure>
    <figure><img src="ellinia-concept.png" alt="엘리니아 시안"><figcaption><strong>엘리니아</strong><span>거대한 나무 · 목재 발판</span></figcaption></figure>
    <figure><img src="perion-concept.png" alt="페리온 시안"><figcaption><strong>페리온</strong><span>붉은 절벽 · 천막</span></figcaption></figure>
    <figure><img src="kerning-concept.png" alt="커닝시티 시안"><figcaption><strong>커닝시티</strong><span>공사장 · 추락주의</span></figcaption></figure>
    <figure><img src="lith-concept.png" alt="리스항구 시안"><figcaption><strong>리스항구</strong><span>범선 · 항구 건물</span></figcaption></figure>
  </main>
</body>
</html>
