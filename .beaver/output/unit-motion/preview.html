<!doctype html><html lang="ko"><meta charset="utf-8"><title>유닛 모션 확인</title><style>body{margin:0;background:#202a38;color:#eef3fc;font:16px system-ui}header{position:sticky;top:0;padding:18px 24px;background:#19212e;z-index:2}h1{font-size:22px;margin:0 0 8px}button,select{font:inherit;padding:7px 12px;margin:5px;border:1px solid #61708a;border-radius:8px;background:#324158;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:16px;padding:20px}.card{background:#303c4f;border-radius:14px;padding:14px}canvas{width:100%;max-height:450px;object-fit:contain;background:radial-gradient(ellipse at 50% 80%,#526477,#303c4f 65%)}h2{font-size:18px}.meta{color:#bbd0e9;font-size:13px}</style><header><h1>유닛 모션 확인</h1><div>새 PNG 프레임 미리보기 · 게임 연결 완료</div><button id="pause">일시정지</button><button id="flip">좌우 반전</button><select id="speed"><option value="1">1배속</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option></select></header><main class="grid"></main><script>const jobs=[{"job": "il", "id": "ice-lightning-mage", "name": "아크메이지(썬·콜)", "actions": {"wait": {"key": "stand1", "order": [1, 2, 1, 3], "durations": [0.65, 0.45, 0.65, 0.45]}, "chain-lightning": {"key": "swingO1", "durations": [0.18, 0.12, 0.08, 0.07, 0.35]}, "blizzard": {"key": "swingO3", "durations": [0.21, 0.09, 0.93, 0.09, 0.48]}}}, {"job": "fp", "id": "fire-poison-mage", "name": "아크메이지(불·독)", "actions": {"wait": {"key": "stand1", "order": [1, 2, 1, 3], "durations": [0.65, 0.45, 0.65, 0.45]}, "poison-region": {"key": "poisonRegion", "durations": [0.25, 0.15, 0.3, 0.15, 0.35]}, "dot-punisher": {"key": "dotPunisher", "durations": [0.2, 0.15, 0.25, 0.15, 0.45]}}}, {"job": "bishop", "id": "bishop", "name": "비숍", "actions": {"wait": {"key": "stand1", "order": [1, 2, 1, 3], "durations": [0.65, 0.45, 0.65, 0.45]}, "angel-ray": {"key": "swingO1", "durations": [0.09, 0.06, 0.18, 0.12, 0.35]}, "genesis": {"key": "swingO3", "durations": [0.35, 0.15, 0.3, 0.15, 0.55]}, "divine-punishment": {"key": "divinePunishment", "durations": [0.15, 0.1, 0.15, 0.1, 0.3]}}}, {"job": "hero", "id": "hero", "name": "히어로", "actions": {"wait": {"key": "stand1", "order": [1, 2, 1, 3], "durations": [0.65, 0.45, 0.65, 0.45]}, "raging-blow": {"key": "swingO3", "durations": [0.06, 0.18, 0.06, 0.12, 0.06, 0.12, 0.18, 0.12]}, "enraged-raging-blow": {"key": "enragedRagingBlow", "durations": [0.18, 0.12, 0.12, 0.08, 0.12, 0.08, 0.2]}}}];const heroMotion={"bounds": [0.06, 0.24, 0.3, 0.42, 0.48, 0.6, 0.78, 0.9], "durations": [0.06, 0.18, 0.06, 0.12, 0.06, 0.12, 0.18, 0.12], "names": ["\uac80\uc744 \ub4a4\ub85c \ub2f9\uae30\uae30", "\ub4a4\ucabd \uc218\ud3c9 \uc900\ube44", "\uc6d0\ud638 \uc9c4\uc785", "\uc6d0\ud638 \ubca0\uae30", "\uac80 \ubc29\ud5a5 \uc804\ud658", "\uc218\ud3c9 \uacf5\uaca9", "\uc218\ud3c9 \ub9c8\ubb34\ub9ac", "\uac80 \ud68c\uc218"], "hand": [[400, 495], [426, 479], [369, 468], [376, 499], [334, 504], [225, 486], [228, 486]], "effectGrip": [[0, 0], [25, 48], [25, 45], [25, 41], [200, 151], [184, 211], [108, 212], [29, 192], [207, 158], [210, 74], [211, 56], [206, 34], [210, 40], [207, 35]], "effectScale": 5, "effectDurations": [0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.03, 0.03], "note": "\uc77c\ubc18\uae30 \uac80 \uc5c6\ub294 PNG + \uc6d0\ubcf8 FX\ub97c \uc190 \uc704\uce58\uc5d0 \ub9de\ucdb0 \uc7ac\ubc30\uce58\ud55c \ube0c\ub77c\uc6b0\uc800 \ud569\uc131 \uc5f0\uad6c. \uae30\uc874 \ub7f0\ud0c0\uc784 scale2/feet(0,0) \uc7ac\ud604\uc774 \uc544\ub2d8. \uc801\uc6a9 \uc2dc \uac19\uc740 \ud504\ub808\uc784\ubcc4 \uc190\uc7a1\uc774 \uc575\ucee4 \uc7ac\uc0dd \ud544\uc694."};const heroEffects=Array.from({length:14},(_,n)=>{const i=new Image();i.src='../hero-motion/effect-raw/'+String(n).padStart(2,'0')+'.png';return i;});let running=true,flip=false,speed=1;document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#pause').textContent=running?'일시정지':'재생'};document.querySelector('#flip').onclick=()=>flip=!flip;document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);const views=[];for(const job of jobs){const el=document.createElement('section');el.className='card';el.innerHTML='<h2>'+job.name+'</h2><select></select><canvas width="704" height="704"></canvas><div class="meta"></div>';document.querySelector('main').append(el);const select=el.querySelector('select');const sequences={};for(const [name,a]of Object.entries(job.actions)){select.add(new Option(name,name));const order=a.order||a.durations.map((_,i)=>i+1);sequences[name]={...a,images:order.map(n=>{const i=new Image();i.src='../../../assets/design/characters/'+job.id+'/frames/'+name+'/motion'+String(n).padStart(2,'0')+'.png';return i})};}const view={job:job.job,el,canvas:el.querySelector('canvas'),sequences,selected:'wait',t:0};select.onchange=()=>{view.selected=select.value;view.t=0;};views.push(view);}let last=performance.now();function tick(now){const dt=(now-last)/1000;last=now;for(const v of views){if(running)v.t+=dt*speed;const a=v.sequences[v.selected];const total=a.durations.reduce((x,y)=>x+y,0);let t=v.t%(total+(v.selected==='wait'?0:.7)),index=0;let img;if(t>=total){img=v.sequences.wait.images[0];}else{while(index<a.durations.length-1&&t>=a.durations[index]){t-=a.durations[index++];}img=a.images[index];}const ctx=v.canvas.getContext('2d');ctx.clearRect(0,0,704,704);ctx.save();if(flip){ctx.translate(704,0);ctx.scale(-1,1);}if(img.complete&&img.naturalWidth){const x=(704-img.naturalWidth)/2,y=640-(img.naturalHeight-64);ctx.drawImage(img,x,y);}if(v.job==='hero'&&v.selected==='raging-blow'){const et=v.t%(total+.7);if(et<.78&&index<7){let ef=et>=.75?13:et>=.72?12:Math.floor(et/.06);const ei=heroEffects[ef],h=heroMotion.hand[index],g=heroMotion.effectGrip[ef];if(ef>0&&ei.complete&&ei.naturalWidth)ctx.drawImage(ei,h[0]-g[0]*5,h[1]-g[1]*5,ei.naturalWidth*5,ei.naturalHeight*5);}}ctx.restore();v.el.querySelector('.meta').textContent=(index+1)+' / '+a.images.length+' · '+total.toFixed(2)+'초';}requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>
