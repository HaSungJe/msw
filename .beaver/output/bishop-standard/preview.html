<!doctype html><meta charset="utf-8"><title>원화 비율 · 모션 비교</title><style>body{background:#18222d;color:#eee;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,352px);gap:18px}.stage{width:352px;height:352px;background:#384454;position:relative}.stage img{position:absolute}h2{font-size:15px}button,select{padding:8px;margin:8px}</style><h1>원화 유지 + 비숍 모션 비율</h1><p>같은 픽셀 배율·발 위치로 표시합니다. 비숍·불독 기존 모션 보존, 썬콜 비율 보정, 히어로 표시 크기 보정.</p><button id="play">일시정지</button><select id="speed"><option value="1">1배속</option><option value=".25">0.25배속</option></select><main></main><script>const actions=[["bishop","wait",[1,2,1,3],[0.65,0.45,0.65,0.45]],["ice-lightning-mage","wait",[1,2,1,3],[0.65,0.45,0.65,0.45]],["fire-poison-mage","wait",[1,2,1,3],[0.65,0.45,0.65,0.45]],["hero","wait",[1,2,1,3],[0.65,0.45,0.65,0.45]],["ice-lightning-mage","chain-lightning",[1,2,3,4,5],[0.18,0.12,0.08,0.07,0.35]],["ice-lightning-mage","blizzard",[1,2,3,4,5],[0.21,0.09,0.93,0.09,0.48]],["hero","raging-blow",[1,2,3,4,5,6,7,8],[0.06,0.18,0.06,0.12,0.06,0.12,0.18,0.12]],["hero","enraged-raging-blow",[1,2,3,4,5,6,7],[0.18,0.12,0.12,0.08,0.12,0.08,0.2]],["fire-poison-mage","poison-region",[1,2,3,4,5],[0.25,0.15,0.3,0.15,0.35]],["fire-poison-mage","dot-punisher",[1,2,3,4,5],[0.2,0.15,0.25,0.15,0.45]]];let playing=true,time=0,last=performance.now();const nodes=actions.map(a=>{const s=document.createElement("section");s.innerHTML="<h2>"+a[0]+" / "+a[1]+"</h2><div class=stage><img></div>";document.querySelector("main").append(s);const im=s.querySelector("img");im.style.cssText=a[1]==="wait"?"width:288px;left:32px;top:64px":"width:352px;left:0;top:0";return im});document.querySelector("#play").onclick=()=>{playing=!playing;document.querySelector("#play").textContent=playing?"일시정지":"재생"};function tick(n){if(playing)time+=(n-last)/1000*Number(document.querySelector("#speed").value);last=n;actions.forEach((a,j)=>{let t=time%a[3].reduce((x,y)=>x+y,0),i=0;while(t>=a[3][i]&&i<a[3].length-1){t-=a[3][i];i++}const src="../../../assets/design/characters/"+a[0]+"/frames/"+a[1]+"/motion"+String(a[2][i]).padStart(2,"0")+".png";if(nodes[j].getAttribute("src")!==src)nodes[j].src=src});requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
