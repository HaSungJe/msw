<!doctype html><html lang="ko"><meta charset="utf-8"><title>히어로 모션 비율 수정</title><style>body{margin:24px;background:#172131;color:#f3f5fb;font:16px system-ui}h1{font-size:24px}button,select{font:inherit;padding:8px 16px;margin-right:8px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#344153;border-radius:12px;padding:12px}canvas{width:100%}small{color:#c7d3e4}h2{font-size:17px}</style><h1>히어로 — 확정 원화 + 비숍 기준 비율</h1><p>대기 3장 / 레이징 블로우 8장 / 인레이지 7장. 공격은 몸체만 표시하며 게임에서 검·불꽃을 합성합니다.</p><p><button id="pause">일시정지</button><button id="flip">좌우 반전</button><select id="speed"><option value="1">실제 속도</option><option value="0.25">0.25배</option><option value="0.5">0.5배</option></select></p><main></main><script>
const root='../../../assets/design/characters/',configs=[['비숍 기준 대기','bishop','wait',[1,2,1,3],[.65,.45,.65,.45]],['히어로 대기','hero','wait',[1,2,1,3],[.65,.45,.65,.45]],['레이징 블로우','hero','raging-blow',[1,2,3,4,5,6,7,8],[.06,.18,.06,.12,.06,.12,.18,.12]],['인레이지','hero','enraged-raging-blow',[1,2,3,4,5,6,7],[.18,.12,.12,.08,.12,.08,.20]]];let paused=false,flip=false,t=0,last=performance.now();const views=configs.map(([title,id,action,seq,times])=>{let el=document.createElement('article');el.innerHTML='<h2>'+title+'</h2><canvas width="704" height="704"></canvas><small></small>';document.querySelector('main').append(el);return{el,ctx:el.querySelector('canvas').getContext('2d'),seq,times,images:seq.map(n=>{const im=new Image;im.src=root+id+'/frames/'+action+'/motion'+String(n).padStart(2,'0')+'.png';return im})}});document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재생':'일시정지'};document.querySelector('#flip').onclick=()=>flip=!flip;function tick(now){if(!paused)t+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;for(const v of views){const cycle=v.times.reduce((a,b)=>a+b,0);let rem=t%cycle,i=0;while(i<v.times.length-1&&rem>=v.times[i])rem-=v.times[i++];const im=v.images[i],c=v.ctx;c.clearRect(0,0,704,704);c.strokeStyle='#718397';c.beginPath();c.moveTo(50,641);c.lineTo(654,641);c.stroke();if(im.complete&&im.naturalWidth){c.save();if(flip){c.translate(704,0);c.scale(-1,1)}c.drawImage(im,(704-im.naturalWidth)/2,704-im.naturalHeight);c.restore()}v.el.querySelector('small').textContent='프레임 '+String(v.seq[i]).padStart(2,'0')+' · '+cycle.toFixed(2)+'초'}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
